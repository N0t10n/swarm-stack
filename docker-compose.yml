name: swarm

services:
  # writes litellm.yaml into the config dir on first run only (edit it there afterwards);
  # ZimaOS doc: no single-file bind mounts, so the whole directory is mounted
  seed:
    image: busybox:1.37
    restart: "no"
    command:
      - sh
      - -c
      - |
        [ -f /config/litellm.yaml ] || cat > /config/litellm.yaml <<'EOF'
        # Together serverless IDs change often: list yours with
        #   curl -s https://api.together.xyz/v1/models -H "Authorization: Bearer $TOGETHERAI_API_KEY"
        # (non-serverless models fail with 'create a dedicated endpoint'; probe with a tiny call first)
        model_list:
          - model_name: brain
            litellm_params:
              model: anthropic/claude-opus-5-5
              api_key: os.environ/ANTHROPIC_API_KEY
          - model_name: glm-flash
            litellm_params:
              model: together_ai/zai-org/GLM-5.3-Flash
              api_key: os.environ/TOGETHERAI_API_KEY
          - model_name: gpt-oss-120b
            litellm_params:
              model: together_ai/openai/gpt-oss-120b
              api_key: os.environ/TOGETHERAI_API_KEY
          - model_name: deepseek-flash
            litellm_params:
              model: together_ai/deepseek-ai/DeepSeek-V4.1-Flash
              api_key: os.environ/TOGETHERAI_API_KEY
          - model_name: qwen-9b
            litellm_params:
              model: together_ai/Qwen/Qwen3.5-9B
              api_key: os.environ/TOGETHERAI_API_KEY
        general_settings:
          master_key: os.environ/LITELLM_MASTER_KEY
        EOF
    volumes:
      - type: bind
        source: /DATA/AppData/swarm/config
        target: /config

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    volumes:
      - type: bind
        source: /DATA/AppData/swarm/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      retries: 10

  # gateway + admin UI (spend, keys); the app tile opens its UI
  litellm:
    image: ghcr.io/berriai/litellm-database:main-stable
    restart: unless-stopped
    command: ["--config", "/config/litellm.yaml", "--port", "4000"]
    environment:
      DATABASE_URL: postgresql://litellm:litellm@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      STORE_MODEL_IN_DB: ${STORE_MODEL_IN_DB:-True}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TOGETHERAI_API_KEY: ${TOGETHERAI_API_KEY}
    # set SWARM_BIND to the server's tailscale IP (tailscale ip -4) to hide it from the LAN
    ports:
      - target: 4000
        published: ${WEBUI_PORT:-4000}
        host_ip: ${SWARM_BIND:-0.0.0.0}
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/swarm/config
        target: /config
        read_only: true
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # the agent: `docker exec -it -u hermes <container> hermes`
  hermes:
    image: ghcr.io/n0t10n/swarm-hermes:0.1.0
    restart: unless-stopped
    environment:
      LITELLM_URL: http://litellm:4000/v1
      HERMES_API_KEY: ${HERMES_API_KEY:-${LITELLM_MASTER_KEY}}
      HERMES_BRAIN_MODEL: ${HERMES_BRAIN_MODEL:-brain}
      HERMES_WORKER_MODEL: ${HERMES_WORKER_MODEL:-glm-flash}
    # tailnet names (MagicDNS) resolve through tailscaled on the host
    dns:
      - 100.100.100.100
    volumes:
      - type: bind
        source: /DATA/AppData/swarm/hermes
        target: /data/hermes
      - type: bind
        source: /DATA/AppData/swarm/ssh
        target: /home/hermes/.ssh
    depends_on:
      litellm:
        condition: service_started

x-casaos:
  id: io.github.n0t10n.swarm
  architectures: [amd64]
  version: "0.1.0"
  main: litellm
  author: marcos
  category: Developer
  developer: marcos
  title:
    en_US: Swarm
  tagline:
    en_US: "Hermes agent: Opus plans, cheap models do the work"
  description:
    en_US: A Hermes agent whose brain is Claude Opus and whose subagents run on cheaper Together.ai models, all through a LiteLLM gateway. Open a shell in the hermes container, or SSH to the server over Tailscale, and run hermes.
  icon: https://cdn.jsdelivr.net/gh/N0t10n/swarm-stack@main/assets/icon.svg
  thumbnail: https://cdn.jsdelivr.net/gh/N0t10n/swarm-stack@main/assets/thumbnail.png
  index: /ui
  port_map: ${WEBUI_PORT:-4000}
