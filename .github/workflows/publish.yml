name: publish
# Every push to main builds the image: tags `latest` and `sha-<short>` always,
# plus the pyproject version tag the first time only (version tags are immutable).
on:
  push:
    branches: [main]

permissions:
  contents: write # git tag
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: tags
        id: tags
        run: |
          v=$(uv version --short)
          img=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/swarm-orchestrator
          tags="$img:latest,$img:sha-${GITHUB_SHA::7}"
          if docker buildx imagetools inspect "$img:$v" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            tags="$tags,$img:$v"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: steps.tags.outputs.new == 'true'
        run: |
          git tag "v${{ steps.tags.outputs.version }}"
          git push origin "v${{ steps.tags.outputs.version }}"
